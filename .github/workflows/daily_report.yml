name: Daily Japan Stock AI Research Report

on:
  schedule:
    # 日本時間 平日 15:45 (UTC 06:45, 月〜金) に自動実行
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # GitHub画面から手動実行も可能

permissions:
  contents: write # レポートコミット用権限

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: マーケットデータ収集・Gemini分析・Webサイト生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python main.py docs

      - name: 生成されたWebレポートを自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "Auto-update: デイリー株式リサーチレポート発行 [$(date +'%Y-%m-%d')]"
            git push
          fi
